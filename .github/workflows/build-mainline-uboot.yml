# =============================================================================
# 云端编译主线 U-Boot —— 给 Windows 用户用，本地完全不用装 Linux
#
# 用途：修复 RK3588 EVB7 的 TF 卡启动阻塞
#   optee check api revision fail: -1.0 / ### ERROR ### Please RESET the board ###
# 主线 U-Boot 没有 vendor OP-TEE 检查，且带标准 distro boot。
#
# 产物：u-boot-rockchip.bin（约 2–9 MiB）作为 Artifact 下载，
#       在 Windows 上用 tools/patch-bootloader.py 注入镜像，或直写 TF 卡 sector 64。
#
# ⚠ 推到 main 会触发仓库里另一个 workflow（compile-armbian.yml，8 小时编译）。
#   推完后到 Actions 页把那次 run 取消即可；或给 compile-armbian.yml 的 push 加
#   paths-ignore: ['.github/workflows/build-mainline-uboot.yml']
# =============================================================================
name: Build mainline U-Boot (RK3588 EVB7)

on:
  workflow_dispatch:
    inputs:
      uboot_ref:
        description: 'u-boot tag / branch'
        required: true
        default: 'v2025.04'
        type: string
      defconfig:
        description: 'defconfig (主线 EVB 配置)'
        required: true
        default: 'evb-rk3588_defconfig'
        type: string
      ddr_version:
        description: 'rkbin DDR bin 版本关键字（板上实测 v1.17）'
        required: true
        default: 'v1.17'
        type: string
      bl31_version:
        description: 'rkbin BL31 版本关键字（本次日志 v1.48）'
        required: true
        default: 'v1.48'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install cross toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git make gcc bc bison flex swig device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 python3-dev python3-setuptools python3-pyelftools \
            libssl-dev libgnutls28-dev libncurses-dev u-boot-tools coreutils

      - name: Clone u-boot + rkbin
        env:
          REF: ${{ inputs.uboot_ref }}
        run: |
          mkdir -p work
          git clone --depth 1 --branch "$REF" \
            https://source.denx.de/u-boot/u-boot.git work/u-boot \
            || git clone --depth 1 https://github.com/u-boot/u-boot.git work/u-boot
          git clone --depth 1 https://github.com/rockchip-linux/rkbin.git work/rkbin
          git -C work/u-boot describe --always --tags || true
          git -C work/rkbin rev-parse --short HEAD

      - name: Pick DDR / BL31 blobs
        env:
          DDRV: ${{ inputs.ddr_version }}
          BL31V: ${{ inputs.bl31_version }}
        run: |
          set -Eeuo pipefail
          DDR=$(find work/rkbin/bin/rk35 -maxdepth 1 -type f \
                  -iname 'rk3588_ddr_lp4_2112MHz*' | grep -F "$DDRV" | head -1 || true)
          [ -n "$DDR" ] || DDR=$(find work/rkbin/bin/rk35 -maxdepth 1 -type f \
                  -iname 'rk3588_ddr_lp4_2112MHz*' | sort -V | tail -1)
          BL31=$(find work/rkbin/bin/rk35 -maxdepth 1 -type f \
                  -iname "rk3588_bl31_${BL31V}*.elf" | head -1 || true)
          [ -n "$BL31" ] || BL31=$(find work/rkbin/bin/rk35 -maxdepth 1 -type f \
                  -iname 'rk3588_bl31_*.elf' | sort -V | tail -1)
          test -s "$DDR"  || { echo "DDR bin not found";  exit 1; }
          test -s "$BL31" || { echo "BL31 elf not found"; exit 1; }
          echo "ROCKCHIP_TPL=$(realpath "$DDR")"  >> "$GITHUB_ENV"
          echo "BL31=$(realpath "$BL31")"          >> "$GITHUB_ENV"
          echo "DDR_NAME=$(basename "$DDR")"       >> "$GITHUB_ENV"
          echo "BL31_NAME=$(basename "$BL31")"     >> "$GITHUB_ENV"

      - name: Build
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -Eeuo pipefail
          cd work/u-boot
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          test -f "configs/$DEFCONFIG" || {
            echo "defconfig 不存在，可用 rk3588 配置：";
            ls configs/*rk3588*defconfig | xargs -n1 basename; exit 1; }
          make "$DEFCONFIG"
          make -j"$(nproc)" 2>&1 | tee ../build.log
          test -s u-boot-rockchip.bin
          mkdir -p ../../out
          cp -f u-boot-rockchip.bin ../../out/
          cd ../..
          head -c4 out/u-boot-rockchip.bin | od -An -c
          sha256sum out/u-boot-rockchip.bin > out/u-boot-rockchip.bin.sha256

      - name: Verify image magic + write build info
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import sys
          h=open('out/u-boot-rockchip.bin','rb').read(4)
          print('magic:',h)
          sys.exit(0 if h==b'RKNS' else 1)
          PY
          {
            echo "uboot_ref    : ${{ inputs.uboot_ref }}"
            echo "defconfig    : ${{ inputs.defconfig }}"
            echo "DDR bin      : $DDR_NAME"
            echo "BL31         : $BL31_NAME"
            echo "u-boot commit: $(git -C work/u-boot rev-parse --short HEAD)"
            echo "rkbin commit : $(git -C work/rkbin rev-parse --short HEAD)"
            echo ""
            echo "写入方式: dd if=u-boot-rockchip.bin of=/dev/sdX bs=512 seek=64 conv=fsync,notrunc"
            echo "Windows: 见 rk3588-evb7-armbian/windows/README.md"
          } > out/build-info.txt
          cat out/build-info.txt
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-evb7-mainline-uboot
          path: |
            out/u-boot-rockchip.bin
            out/u-boot-rockchip.bin.sha256
            out/build-info.txt
          retention-days: 30
          if-no-files-found: error
