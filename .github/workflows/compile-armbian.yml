name: Compile Armbian for RK3588 EVB7

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发
    inputs:
      ubuntu_release:
        description: 'Ubuntu Release (noble/bookworm)'
        required: true
        default: 'noble'
        type: choice
        options:
        - noble
        - bookworm
      desktop_env:
        description: 'Desktop Environment (cinnamon/gnome/xfce)'
        required: true
        default: 'cinnamon'
        type: choice
        options:
        - cinnamon
        - gnome
        - xfce
      desktop_tier:
        description: 'Desktop App Groups (minimal/mid/full)'
        required: true
        default: 'APPGROUPS_MID'
        type: choice
        options:
        - APPGROUPS_MINIMAL
        - APPGROUPS_MID
        - APPGROUPS_FULL
      build_desktop:
        description: 'Build with Desktop Environment?'
        required: true
        default: 'yes'
        type: choice
        options:
        - 'yes'
        - 'no'

env:
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 480  # 8小时超时
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget gawk gpg build-essential \
          libssl-dev zlib1g-dev uuid-dev libacl1-dev libblkid-dev \
          liblzo2-dev liblz4-dev kmod bc rsync cpio \
          parted dosfstools debootstrap xz-utils qemu-user-static \
          bison flex u-boot-tools curl xxd \
          python3 python3-pip python3-dev python3-venv \
          device-tree-compiler default-jdk \
          gcc-aarch64-linux-gnu libc6-i386 lib32stdc++6
    
    - name: Clone Armbian build framework
      run: |
        git clone --depth=1 --branch=main https://github.com/armbian/build.git armbian-build
        cd armbian-build
        echo "ARMAN_SOURCE=$(pwd)" >> $GITHUB_ENV
    
    - name: Copy board configuration
      run: |
        cd armbian-build
        mkdir -p config/boards/
        cp ../config/boards/rk3588-evb7.csc config/boards/
    
    - name: Apply kernel patches and device trees
      run: |
        cd armbian-build
        mkdir -p patch/kernel/rk35xx-vendor-6.1/
        cp ../patch/kernel/rk35xx-vendor-6.1/* patch/kernel/rk35xx-vendor-6.1/ || true
    
    - name: Compile Armbian
      run: |
        cd armbian-build
        ./compile.sh build \
          BOARD=rk3588-evb7 \
          BRANCH=vendor \
          RELEASE=${{ inputs.ubuntu_release || 'noble' }} \
          BUILD_DESKTOP=${{ inputs.build_desktop || 'yes' }} \
          BUILD_MINIMAL=no \
          DESKTOP_APPGROUPS_SELECTED=${{ inputs.desktop_tier || 'APPGROUPS_MID' }} \
          DESKTOP_ENVIRONMENT=${{ inputs.desktop_env || 'cinnamon' }} \
          KERNEL_BTF=no \
          KERNEL_CONFIGURE=no \
          EXPERT=yes \
          CONFIG_CHANGED=no
      timeout-minutes: 360
    
    - name: Compress image
      run: |
        cd armbian-build/output/images/
        IMG=$(ls *.img 2>/dev/null | head -1)
        if [ -n "$IMG" ]; then
          echo "Compressing: $IMG"
          xz -T0 -v "$IMG"
          echo "IMG_XZ=$IMG.xz" >> $GITHUB_ENV
          sha256sum "$IMG.xz" > "$IMG.xz.sha256"
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: armbian-rk3588-evb7-${{ github.run_id }}
        path: |
          armbian-build/output/images/*.img.xz
          armbian-build/output/images/*.img.xz.sha256
        retention-days: 30

    - name: Create Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        name: "Armbian RK3588 EVB7 — ${{ inputs.ubuntu_release || 'noble' }} ${{ inputs.desktop_env || 'cinnamon' }}"
        tag_name: v${{ github.run_number }}
        files: |
          armbian-build/output/images/*.img.xz
          armbian-build/output/images/*.img.xz.sha256
        body: |
          ## Armbian for RK3588 EVB7 LP4 V10

          | Item | Value |
          |---|---|
          | **Release** | `${{ inputs.ubuntu_release || 'noble' }}` |
          | **Desktop** | `${{ inputs.desktop_env || 'cinnamon' }}` |
          | **Desktop Tier** | `${{ inputs.desktop_tier || 'APPGROUPS_MID' }}` |
          | **Kernel** | 6.1 vendor (rk35xx) |
          | **Build** | #${{ github.run_number }} |

          ### Flashing
          ```bash
          xz -d Armbian-*.img.xz
          sudo dd if=Armbian-*.img of=/dev/sdX bs=4M status=progress
          ```

          > Replace `/dev/sdX` with your TF card device.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build summary
      run: |
        echo "## Armbian Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Release | ${{ inputs.ubuntu_release || 'noble' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Desktop | ${{ inputs.desktop_env || 'cinnamon' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Kernel | 6.1 vendor |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Compressed Image" >> $GITHUB_STEP_SUMMARY
        ls -lh armbian-build/output/images/*.xz >> $GITHUB_STEP_SUMMARY || true
