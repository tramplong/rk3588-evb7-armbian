name: Compile Armbian for RK3588 EVB7

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发
    inputs:
      ubuntu_release:
        description: 'Ubuntu Release (noble/bookworm)'
        required: true
        default: 'noble'
        type: choice
        options:
        - noble
        - bookworm
      desktop_env:
        description: 'Desktop Environment (cinnamon/gnome/xfce)'
        required: true
        default: 'cinnamon'
        type: choice
        options:
        - cinnamon
        - gnome
        - xfce
      build_desktop:
        description: 'Build with Desktop Environment?'
        required: true
        default: 'yes'
        type: choice
        options:
        - 'yes'
        - 'no'

env:
  TZ: Asia/Shanghai

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 480  # 8小时超时
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget gawk gpg build-essential \
          libssl-dev zlib1g-dev uuid-dev libacl1-dev libblkid-dev \
          liblzo2-dev liblz4-dev kmod bc rsync cpio \
          parted dosfstools debootstrap xz-utils qemu-user-static \
          bison flex u-boot-tools curl xxd \
          python3 python3-pip python3-dev python3-venv \
          device-tree-compiler default-jdk \
          gcc-aarch64-linux-gnu libc6-i386 lib32stdc++6
    
    - name: Clone Armbian build framework
      run: |
        git clone --depth=1 --branch=main https://github.com/armbian/build.git armbian-build
        cd armbian-build
        echo "ARMAN_SOURCE=$(pwd)" >> $GITHUB_ENV
    
    - name: Copy board configuration
      run: |
        cd armbian-build
        mkdir -p config/boards/
        cp ../config/boards/rk3588-evb7.csc config/boards/
    
    - name: Apply kernel patches
      run: |
        cd armbian-build
        mkdir -p patch/kernel/rk35xx-vendor-6.1/
        cp ../patch/kernel/rk35xx-vendor-6.1/*.patch patch/kernel/rk35xx-vendor-6.1/ || true
    
    - name: Compile Armbian
      run: |
        cd armbian-build
        ./compile.sh build \
          BOARD=rk3588-evb7 \
          BRANCH=vendor \
          RELEASE=${{ inputs.ubuntu_release || 'noble' }} \
          BUILD_DESKTOP=${{ inputs.build_desktop || 'yes' }} \
          BUILD_MINIMAL=no \
          DESKTOP_ENVIRONMENT=${{ inputs.desktop_env || 'cinnamon' }} \
          KERNEL_BTF=no \
          KERNEL_CONFIGURE=no \
          EXPERT=yes \
          CONFIG_CHANGED=no
      timeout-minutes: 360
    
    - name: Upload compiled image
      uses: actions/upload-artifact@v4
      with:
        name: armbian-rk3588-evb7-${{ github.run_id }}
        path: armbian-build/output/images/*.img
        retention-days: 30
        
    - name: Generate download link
      run: |
        echo "## 🎉 编译完成！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 下载镜像" >> $GITHUB_STEP_SUMMARY
        echo "1. 点击上方的 **Actions** 标签页" >> $GITHUB_STEP_SUMMARY
        echo "2. 找到本次编译任务" >> $GITHUB_STEP_SUMMARY
        echo "3. 在 **Artifacts** 区域下载镜像文件" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 镜像信息" >> $GITHUB_STEP_SUMMARY
        ls -lh armbian-build/output/images/ >> $GITHUB_STEP_SUMMARY || true
