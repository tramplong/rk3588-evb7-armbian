name: Compile Armbian for RK3588 EVB7

# 完整重编译（1–8 小时）。日常修固件请用 patch-from-release.yml，分钟级出包。
#
# 两种触发方式：
#   1) Actions 页 -> Run workflow
#   2) 编辑并提交 trigger-full-build.txt
# 改 config/、patch/、README 等不会误触发这个昂贵任务。
#
# 2026-11 修正：
#   * ubuntu-22.04 -> ubuntu-24.04（22.04 runner 已弃用）
#   * 编译后强制校正 /boot/armbianEnv.txt 的 fdtfile（原值指向不存在的 DTB）
#   * 加自包含的启动结构校验（不再依赖仓库里的外部工具）
#   * armbian/build 可固定 ref，避免上游 main 变动导致失败

on:
  workflow_dispatch:
    inputs:
      ubuntu_release:
        description: 'Ubuntu Release'
        required: false
        default: 'noble'
        type: choice
        options: [noble, bookworm]
      desktop_env:
        description: 'Desktop Environment'
        required: false
        default: 'cinnamon'
        type: choice
        options: [cinnamon, gnome, xfce]
      desktop_tier:
        description: 'Desktop App Groups'
        required: false
        default: 'APPGROUPS_MID'
        type: choice
        options: [APPGROUPS_MINIMAL, APPGROUPS_MID, APPGROUPS_FULL]
      build_desktop:
        description: 'Build with Desktop?'
        required: false
        default: 'yes'
        type: choice
        options: ['yes', 'no']
      armbian_ref:
        description: 'armbian/build ref (main / tag / commit)'
        required: false
        default: 'main'
        type: string
  push:
    branches: [main]
    paths:
      - 'trigger-full-build.txt'

env:
  TZ: Asia/Shanghai
  RELEASE: ${{ inputs.ubuntu_release || 'noble' }}
  DE: ${{ inputs.desktop_env || 'cinnamon' }}
  TIER: ${{ inputs.desktop_tier || 'APPGROUPS_MID' }}
  WITH_DESKTOP: ${{ inputs.build_desktop || 'yes' }}
  ARMBIAN_REF: ${{ inputs.armbian_ref || 'main' }}
  FDT: rk3588-evb7-lp4-v10-linux.dtb

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget gawk gpg build-essential libssl-dev zlib1g-dev uuid-dev \
            libacl1-dev libblkid-dev liblzo2-dev liblz4-dev kmod bc rsync cpio \
            parted dosfstools debootstrap xz-utils qemu-user-static bison flex \
            u-boot-tools curl xxd python3 python3-pip python3-dev python3-venv \
            device-tree-compiler default-jdk gcc-aarch64-linux-gnu \
            libc6-i386 lib32stdc++6

      - name: Clone Armbian build framework
        run: |
          set -e
          echo "armbian/build ref: $ARMBIAN_REF"
          git clone --depth 1 --branch main \
            https://github.com/armbian/build.git armbian-build
          if [ "$ARMBIAN_REF" != "main" ]; then
            cd armbian-build
            git fetch --depth 1 origin "$ARMBIAN_REF"
            git checkout FETCH_HEAD
          fi
          git -C armbian-build rev-parse HEAD

      - name: Copy board config + kernel patches
        run: |
          set -e
          cd armbian-build
          mkdir -p config/boards/ patch/kernel/rk35xx-vendor-6.1/
          cp ../config/boards/rk3588-evb7.csc config/boards/
          cp ../patch/kernel/rk35xx-vendor-6.1/* patch/kernel/rk35xx-vendor-6.1/ || true
          grep -n 'BOOT_FDT_FILE' config/boards/rk3588-evb7.csc

      - name: Compile Armbian
        run: |
          set -e
          cd armbian-build
          ./compile.sh build \
            BOARD=rk3588-evb7 \
            BRANCH=vendor \
            RELEASE="$RELEASE" \
            BUILD_DESKTOP="$WITH_DESKTOP" \
            BUILD_MINIMAL=no \
            DESKTOP_APPGROUPS_SELECTED="$TIER" \
            DESKTOP_ENVIRONMENT="$DE" \
            KERNEL_BTF=no KERNEL_CONFIGURE=no EXPERT=yes CONFIG_CHANGED=no
        timeout-minutes: 360

      # 关键修复：不管 csc 有没有生效，都在成品里强制校正 fdtfile
      - name: Fix boot fdtfile (critical SD-boot fix)
        run: |
          set -Eeuo pipefail
          cd armbian-build/output/images/
          IMG=$(ls *.img 2>/dev/null | head -1)
          test -n "$IMG"
          echo "Image: $IMG"
          LOOP=$(sudo losetup -P -f --show "$IMG")
          for i in $(seq 1 20); do [ -b "${LOOP}p1" ] && break; sleep 0.2; done
          test -b "${LOOP}p1"
          MNT=$(mktemp -d)
          sudo mount "${LOOP}p1" "$MNT"
          DTBDIR=$(echo "$MNT"/boot/dtb*/rockchip)
          test -f "$DTBDIR/$FDT" || {
            echo "ERROR: $FDT missing. EVB7 dtbs:"; ls "$DTBDIR" | grep evb7; exit 1; }
          echo "--- before ---"; cat "$MNT/boot/armbianEnv.txt"
          sudo sed -i "s|^fdtfile=.*|fdtfile=rockchip/$FDT|" "$MNT/boot/armbianEnv.txt"
          sudo ln -sfn "$FDT" "$DTBDIR/rk3588-evb7.dtb"
          echo "--- after ---";  cat "$MNT/boot/armbianEnv.txt"
          sync
          sudo umount "$MNT"
          sudo losetup -d "$LOOP"
          rmdir "$MNT"

      - name: Compress image
        run: |
          set -e
          cd armbian-build/output/images/
          IMG=$(ls *.img 2>/dev/null | head -1)
          if [ -n "$IMG" ]; then
            echo "Compressing: $IMG"
            xz -T0 -9 -v -c "$IMG" > "$IMG.xz"
            sha256sum "$IMG.xz" > "$IMG.xz.sha256"
            ls -lh "$IMG.xz"
          fi

      # 自包含校验：不依赖仓库里任何额外工具
      - name: Verify image structure
        run: |
          set -Eeuo pipefail
          cd armbian-build/output/images/
          XZ=$(ls *.img.xz | head -1)
          xz -dc "$XZ" | head -c $((16*1024*1024)) > /tmp/head.img
          python3 - <<'PY'
          d = open('/tmp/head.img','rb').read()
          assert d[512:520] == b'EFI PART',     'GPT header missing'
          assert d[64*512:64*512+4] == b'RKNS', 'idbloader @sector64 missing'
          assert d[16384*512:16384*512+4] == bytes.fromhex('d00dfeed'), 'u-boot.itb missing'
          print('OK: GPT + RKNS idbloader + FIT u-boot.itb')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: armbian-rk3588-evb7-${{ github.run_id }}
          path: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/*.img.xz.sha256
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Armbian RK3588 EVB7 — ${{ env.RELEASE }} ${{ env.DE }}"
          tag_name: v${{ github.run_number }}
          files: |
            armbian-build/output/images/*.img.xz
            armbian-build/output/images/*.img.xz.sha256
          body: |
            ## Armbian for RK3588 EVB7 LP4 V10

            | Item | Value |
            |---|---|
            | Release | `${{ env.RELEASE }}` |
            | Desktop | `${{ env.DE }}` |
            | Kernel | 6.1 vendor (rk35xx) |
            | fdtfile | `rockchip/rk3588-evb7-lp4-v10-linux.dtb` |

            > 镜像自带 vendor U-Boot。若板载 eMMC 仍是原厂 Android，
            > 还需用 "Build mainline U-Boot" workflow 的产物写入 TF 卡 sector 64 才能启动。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
