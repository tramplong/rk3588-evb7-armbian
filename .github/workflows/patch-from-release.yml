name: Patch SD-boot firmware from Release

# 不重编译：下载已有 Release 镜像，修好 fdtfile + 补 extlinux，重新压缩出包。
# 约 10–20 分钟，产物可直接写 TF 卡（配合主线 U-Boot）。
#
# 触发：Actions 页 -> Run workflow
# 默认基础镜像是 Release v8（2026-06-28 成功构建的那份）。

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '基础镜像 .img.xz 直链'
        required: false
        default: 'https://github.com/tramplong/rk3588-evb7-armbian/releases/download/v8/Armbian-unofficial_26.08.0-trunk_Rk3588-evb7_noble_vendor_6.1.115_cinnamon_desktop.img.xz'
        type: string
      make_release:
        description: '同时创建 Release（单文件需 < 2 GiB）'
        required: false
        default: true
        type: boolean

env:
  TZ: Asia/Shanghai
  BASE_URL: ${{ inputs.base_url || 'https://github.com/tramplong/rk3588-evb7-armbian/releases/download/v8/Armbian-unofficial_26.08.0-trunk_Rk3588-evb7_noble_vendor_6.1.115_cinnamon_desktop.img.xz' }}
  FDT: rk3588-evb7-lp4-v10-linux.dtb
  OUT: output/Armbian_rk3588-evb7_sd-boot_fixed.img.xz

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xz-utils util-linux e2fsprogs parted u-boot-tools python3 coreutils curl gdisk
          mkdir -p work output

      - name: Download base image
        run: |
          set -e
          curl -fL --retry 3 --retry-delay 10 -o work/base.img.xz "$BASE_URL"
          ls -lh work/base.img.xz
          test -s work/base.img.xz

      - name: Patch fdtfile + add extlinux (self-contained, no extra repo files)
        run: |
          set -Eeuo pipefail
          echo "Decompressing base image ..."
          xz -dc work/base.img.xz > work/base.img
          ls -lh work/base.img
          LOOP=$(sudo losetup -P -f --show work/base.img)
          for i in $(seq 1 20); do [ -b "${LOOP}p1" ] && break; sleep 0.2; done
          test -b "${LOOP}p1"
          MNT=$(mktemp -d)
          sudo mount "${LOOP}p1" "$MNT"
          DTBDIR=$(echo "$MNT"/boot/dtb*/rockchip)
          test -f "$DTBDIR/$FDT" || {
            echo "ERROR: $FDT missing"; ls "$DTBDIR" | grep evb7; exit 1; }

          echo "--- armbianEnv.txt before ---"; cat "$MNT/boot/armbianEnv.txt"
          sudo sed -i "s|^fdtfile=.*|fdtfile=rockchip/$FDT|" "$MNT/boot/armbianEnv.txt"
          sudo ln -sfn "$FDT" "$DTBDIR/rk3588-evb7.dtb"
          echo "--- armbianEnv.txt after ---";  cat "$MNT/boot/armbianEnv.txt"

          # 主线 U-Boot 优先扫 extlinux.conf；三份兜底兼容 QuarkPi 型厂 U-Boot
          ROOT_UUID=$(sudo blkid -s UUID -o value "${LOOP}p1")
          echo "rootfs UUID: $ROOT_UUID"
          sudo mkdir -p "$MNT/boot/extlinux" "$MNT/boot/mmc0_extlinux" "$MNT/boot/mmc1_extlinux"
          for d in extlinux mmc0_extlinux mmc1_extlinux; do
            printf '%s\n' \
              "LABEL Armbian" \
              "  MENU LABEL Armbian 6.1.115-vendor-rk35xx" \
              "  LINUX /Image" \
              "  INITRD /uInitrd" \
              "  FDT /dtb/rockchip/$FDT" \
              "  APPEND root=UUID=$ROOT_UUID rootwait rootfstype=ext4 console=ttyS2,1500000 console=tty1 consoleblank=0 loglevel=1 cma=256M" \
              | sudo tee "$MNT/boot/$d/extlinux.conf" > /dev/null
          done
          sync
          sudo umount "$MNT"
          sudo losetup -d "$LOOP"
          rmdir "$MNT"
          # 修 GPT 分区项 CRC / 备份 GPT 位置（必须在卸载 loop 之后操作裸文件）
          sudo sgdisk -e work/base.img || true

      - name: Recompress
        run: |
          set -Eeuo pipefail
          xz -T0 -9 -v -c work/base.img > "$OUT"
          rm -f work/base.img work/base.img.xz
          sha256sum "$OUT" > "$OUT.sha256"
          ls -lh output/

      - name: Verify image structure
        run: |
          set -Eeuo pipefail
          xz -dc "$OUT" | head -c $((16*1024*1024)) > /tmp/head.img
          python3 - <<'PY'
          import struct, zlib
          d = open('/tmp/head.img','rb').read()
          assert d[512:520] == b'EFI PART',     'GPT header missing'
          assert d[64*512:64*512+4] == b'RKNS', 'idbloader @sector64 missing'
          assert d[16384*512:16384*512+4] == bytes.fromhex('d00dfeed'), 'u-boot.itb missing'
          h = d[512:512+92]
          ent_lba = struct.unpack_from('<Q', h, 0x48)[0]
          n, sz = struct.unpack_from('<II', h, 0x50)
          crc = struct.unpack_from('<I', h, 0x58)[0]
          calc = zlib.crc32(d[ent_lba*512:ent_lba*512+n*sz]) & 0xffffffff
          assert crc == calc, f'GPT partition array CRC wrong: {crc:08x} != {calc:08x}'
          print('OK: GPT + CRC + RKNS idbloader + FIT u-boot.itb')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3588-evb7-sd-boot-fixed-${{ github.run_number }}
          path: |
            output/*.img.xz
            output/*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.make_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sd-boot-v${{ github.run_number }}
          name: "Armbian RK3588 EVB7 — SD boot fixed #${{ github.run_number }}"
          files: |
            output/*.img.xz
            output/*.sha256
          body: |
            ## TF 卡启动修复版（基于 Release v8，未重编译内核）

            | Item | Value |
            |---|---|
            | fdtfile | `rockchip/rk3588-evb7-lp4-v10-linux.dtb` |
            | extlinux | `/boot/extlinux/` + `mmc0_extlinux/` + `mmc1_extlinux/` |
            | Kernel | 6.1.115-vendor-rk35xx |
            | Bootloader | sector 64 RKNS + sector 16384 u-boot.itb（未改动） |

            > 仍需配合 "Build mainline U-Boot" 产物写入 sector 64，
            > 否则原厂 Android eMMC 组合下会卡在 `optee api revision is too low`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
