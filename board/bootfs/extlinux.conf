# RK3588 EVB7 LP4 V10 — U-Boot sysboot/extlinux 配置（模板）
# 01-fix-sd-boot.sh 会替换 @FDTFILE@ / @ROOTDEV@，并同时复制到
# /boot/extlinux/、/boot/mmc0_extlinux/、/boot/mmc1_extlinux/。
# 后两者是 ophub 对 RK3588 出厂 U-Boot「只认 mmcN_extlinux」的兼容做法。
LABEL Armbian
  MENU LABEL Armbian 6.1.115-vendor-rk35xx (TF/SD)
  LINUX /Image
  INITRD /uInitrd
  FDT /dtb/rockchip/@FDTFILE@
  APPEND root=@ROOTDEV@ rootwait rootfstype=ext4 console=ttyS2,1500000 console=tty1 consoleblank=0 loglevel=1 cma=256M
